[workspace]
resolver = "3"
members = [
  "syncit-client",
  "syncit-core",
  "syncit-gui",
  "syncit-server",
]

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["full"] }
anyhow = "1.0.104"
automerge = "0.11.0"
autosurgeon = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
gpui = { git = "https://github.com/zed-industries/zed", version = "*" }
gpui_platform = { git = "https://github.com/zed-industries/zed", version = "*", features = ["font-kit", "wayland", "x11"] }
syncit-core = { path = "syncit-core" }
